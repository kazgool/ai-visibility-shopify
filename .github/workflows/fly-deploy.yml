# Deploy to Fly on every push to main.
#
# Runs from GitHub's network, so a flaky route between the laptop and
# api.machines.dev can never block a release again. The secret FLY_API_TOKEN
# is a deploy-scoped token (fly tokens create deploy), not a personal one.

name: Fly Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a ai-visibility-all-in-one
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
