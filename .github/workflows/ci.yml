# Tests on every push and pull request.
#
# Came from the Shopify template running `yarn install` on three Node
# versions, which failed on every commit since this project uses npm - a red
# tick you learn to ignore is worse than no tick at all. Now it installs with
# npm and actually runs the suite, on the Node version production uses.

name: CI

on: [push, pull_request]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check Liquid syntax
        run: node scripts/check-liquid.mjs
      - name: Check rendered Liquid JSON
        run: node scripts/check-liquid-json.mjs
      - name: Lint
        run: npm run lint
