# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4261bcd7389bbd477f25254bd79d6298"
name = "MRDigital AI Visibility AiO"
application_url = "https://ai-visibility-all-in-one.fly.dev"
embedded = true
handle = "ai-visibility-all-in-one"

[build]
automatically_update_urls_on_dev = true
dev_store_url = "mrdigital-dev.myshopify.com"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/themes/publish"
  topics = [ "themes/publish" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# read_markets added 4 September 2026 (Marius). Check B9 asks whether a
# multi-market shop declares hreflang; without this scope the `markets` query
# is refused, readMarkets returns null and B9 can only ever say "could not be
# read". Adding it re-prompts every merchant for authorisation on the next
# load, which costs nothing today - the dev store is the only install.
# The two states B9 keeps are both still reachable and both still tested: a
# single-market shop reads "not applicable", and a refusal (an older token, a
# plan that does not expose markets) still reads "could not be read".
scopes = "read_products,write_products,read_themes,read_markets"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://ai-visibility-all-in-one.fly.dev/auth/callback",
  "https://ai-visibility-all-in-one.fly.dev/auth/shopify/callback",
  "https://ai-visibility-all-in-one.fly.dev/api/auth/callback",
]

[app_proxy]
url = "https://ai-visibility-all-in-one.fly.dev/proxy"
subpath = "ai-visibility"
prefix = "apps"

[pos]
embedded = false
