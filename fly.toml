# AI Visibility All-in-One — Fly.io (ARCHITECTURE §1).
# web: ams + iad. worker: ams, next to the database (Neon Frankfurt).

app = "ai-visibility-all-in-one"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "npm run docker-start"
  worker = "npm run worker"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # BfS p95: no cold starts on the request path
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "1gb"

# Region placement (run once at first deploy):
#   fly scale count web=2 --region ams,iad
#   fly scale count worker=1 --region ams
