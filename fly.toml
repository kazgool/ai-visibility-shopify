# AI Visibility All-in-One — Fly.io (ARCHITECTURE §1).
#
# Maintenance mode since 20 Oct 2026 (CHANGELOG, Version 48): one machine in
# ams runs the web server and the worker in one process
# (server/maintenance.ts). It stops itself after 5 minutes with no request and
# no job due, and Fly's proxy starts it again on the next request. The target
# is about $1/month; the cost is a cold start of a few seconds on the first
# request after a sleep, and schedules that only run while it is awake.
#
# Back to always-on: processes web = "npm run docker-start" and
# worker = "npm run worker", restart policy "always" for the worker,
# auto_stop off with min_machines_running = 1 (see git history).

app = "ai-visibility-all-in-one"
primary_region = "ams"

# Time between the stop signal and SIGKILL on a deploy or restart. Fly's
# default is 5 s, shorter than the worker's 25 s shutdown ceiling
# (worker/runner.ts): a job still running at SIGKILL keeps its queue lock for
# graphile's four hours and its JobRun row says "running" until then.
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Migrations run once per deploy in a temporary machine, not on every boot:
# in maintenance mode a boot is what a webhook waits on, and Shopify gives a
# webhook about 5 s.
[deploy]
  release_command = "npx prisma migrate deploy"

[processes]
  web = "npm run maintenance-start"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  # The process decides when to stop (it knows about running jobs, Fly's
  # proxy does not); the proxy only starts it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "1gb"

# A clean exit is the idle stop and must leave the machine stopped; a crash
# exits non-zero and is restarted.
[[restart]]
  policy = "on-failure"
  processes = ["web"]

# Region placement (run once at first deploy):
#   fly scale count web=1 --region ams
